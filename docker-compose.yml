services:
  api:
    build: .
    image: blast-vibration-api:local
    ports:
      # 宿主端口可由 API_PORT 覆盖，默认 8000
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # 一次性验收服务：复用 api 已构建的镜像（不重复构建、不另打 tag），
  # 等待 api 健康后在容器网络内对其跑全部 pytest，结束即退出。
  # 用法：docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    image: blast-vibration-api:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    command: ["pytest", "-v"]
